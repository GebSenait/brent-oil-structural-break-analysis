# Birhan Energies — Change Point Analysis
# Lint (ruff) and test (pytest) configuration.

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [".venv", "venv", "__pycache__", ".git", "data", "*.ipynb"]

[tool.ruff.format]
quote-style = "double"
